# The menu. Edit this file to change items, prices, descriptions or options; run
#   uv run python -m kiosk.domain.check
# afterwards to check it. Images: put data/images/<item id>.png (or .jpg/.webp).
#
# Items, prices, option groups and option prices are the same as in the earlier prototype.
# Descriptions, ingredients, allergens, caffeine, sweetness, "recommended" and the serving
# temperature of items without a temperature option were INVENTED for the demo:
# `verified: false` marks them until someone on the team has checked them.
#
# Fields of an item:
#   options: option groups the item offers (see option_groups below)
#   temperature: for items WITHOUT the temperature option: how it is served (hot or ice)
#   caffeine: none | low | medium | high
#   sweetness: 0 (not sweet) .. 3 (very sweet)
#   allergens: ids from the allergens list below

allergens:
  - {id: milk, name: 우유}
  - {id: soy, name: 대두}
  - {id: wheat, name: 밀}
  - {id: egg, name: 계란}

categories:
  - {id: coffee, name: 커피, unit: 잔}
  - {id: latte, name: 라떼, unit: 잔}
  - {id: tea_ade, name: 티·에이드, unit: 잔}
  - {id: dessert, name: 디저트, unit: 개}

# required: the customer must choose (the assistant asks). Optional groups keep their first
# choice (or nothing, for multi groups) unless the customer asks.
# say: how the assistant reads a choice aloud (defaults to its name).
# aliases: other words customers use for a choice. The assistant may set a REQUIRED choice only
#   if the customer said its name, its `say` text or one of these (checked in code), so add
#   the words people really use. Spaces are ignored when matching.
option_groups:
  - id: temperature
    name: 온도
    required: true
    multi: false
    choices:
      - id: hot
        name: HOT
        say: 따뜻한
        price: 0
        aliases: [따뜻, 따듯, 뜨거, 뜨겁, 뜨뜻, 핫, 뜨아, hot]
      - id: ice
        name: ICE
        say: 아이스
        price: 0
        # 아이세/아이셀/i see: how the transcription often writes "아이스요"
        aliases: [차가, 차갑, 시원, 아아, ice, 아이세, 아이셀, i see]
  - id: size
    name: 사이즈
    required: true
    multi: false
    choices:
      - id: regular
        name: Regular
        say: 레귤러
        price: 0
        aliases: [작은, 작게, 보통, 기본, 스몰, 아무거나, 상관없, regular]
      - id: large
        name: Large
        say: 라지
        price: 500
        aliases: [큰거, 큰걸, 큰사이즈, 크게, 라아지, large]
  - id: tumbler
    name: 텀블러
    required: false
    multi: true
    choices:
      - {id: tumbler, name: 텀블러 사용, price: 0}
  - id: shot
    name: 커피 샷
    required: false
    multi: false
    choices:
      - {id: none, name: 기본, price: 0}
      - {id: extra_shot, name: 샷 추가, price: 600}
      - {id: two_extra_shots, name: 2샷 추가, price: 1200}
      - {id: decaf, name: 디카페인, price: 1000}
  - id: syrup
    name: 시럽
    required: false
    multi: false
    choices:
      - {id: none, name: 없음, price: 0}
      - {id: vanilla, name: 바닐라 시럽, price: 500}
      - {id: caramel, name: 카라멜 시럽, price: 500}
      - {id: hazelnut, name: 헤이즐넛 시럽, price: 500}
      - {id: light_vanilla, name: 라이트 바닐라 시럽, price: 500}
  - id: topping
    name: 토핑
    required: false
    multi: true
    choices:
      - {id: whipped_cream, name: 휘핑 추가, price: 500, allergens: [milk]}

