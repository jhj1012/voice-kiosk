option_groups:
  - id: temperature
    name: 온도
    required: true
    multi: false
    words: [따뜻, 따듯, 다뜻, 뜻한, 뜨거, 뜨겁, 뜨뜻, 뜨아, 차가, 차갑, 시원, 아이스, 아아, 핫, 온도, hot, ice]
    choices:
      - {id: hot, name: HOT, say: 따뜻한, label: 따뜻하게, price: 0}
      - {id: ice, name: ICE, say: 차가운, label: 차갑게, price: 0}
  - id: size
    name: 사이즈
    required: true
    multi: false
    words: [사이즈, 레귤, 레규, 라지, 라디, 큰, 크게, 작은, 작게, 보통, 기본, 스몰, regular, large]
