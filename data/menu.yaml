      - {id: regular, name: Regular, say: 레귤러, price: 0}
      - {id: large, name: Large, say: 라지, price: 500}
  - id: tumbler
    name: 텀블러
    required: false
    multi: true
    choices:
      - {id: tumbler, name: 텀블러 사용, price: 0}
  - id: shot
    name: 커피 샷
    required: false
    multi: false
    choices:
      - {id: none, name: 기본, price: 0}
      - {id: extra_shot, name: 샷 추가, price: 600}
      - {id: two_extra_shots, name: 2샷 추가, price: 1200}
      - {id: decaf, name: 디카페인, price: 1000}
  - id: syrup
    name: 시럽
    required: false
    multi: false
    choices:
      - {id: none, name: 없음, price: 0}
      - {id: vanilla, name: 바닐라 시럽, price: 500}
      - {id: caramel, name: 카라멜 시럽, price: 500}
