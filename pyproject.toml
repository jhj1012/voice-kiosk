[project]
name = "voice-kiosk"
version = "0.1.0"
description = "Voice-only café kiosk demo: a Gemini Live API assistant behind a telephone handset"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kiosk"]

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Layers: server wires everything; assistant and voice never import each other; domain is pure.
[tool.importlinter]
root_packages = ["kiosk"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: server > assistant | voice > domain > config"
type = "layers"
layers = [
    "kiosk.server",
    "kiosk.assistant | kiosk.voice",
    "kiosk.domain",
    "kiosk.config",
]

[[tool.importlinter.contracts]]
name = "Domain is pure: no network, audio or web framework"
type = "forbidden"
source_modules = ["kiosk.domain"]
forbidden_modules = ["google", "sounddevice", "numpy", "fastapi", "starlette", "uvicorn"]
